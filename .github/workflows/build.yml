name: zimh cross-platform build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            config_preset: ninja-debug
            build_preset: ninja-debug
            name: "Ubuntu (Ninja Debug)"
          - os: ubuntu-latest
            config_preset: ninja-release
            build_preset: ninja-release
            name: "Ubuntu (Ninja Release)"

          - os: macos-latest
            config_preset: xcode-debug
            build_preset: xcode-debug
            name: "macOS (Xcode Debug)"
          - os: macos-latest
            config_preset: xcode-release
            build_preset: xcode-release
            name: "macOS (Xcode Release)"

          - os: windows-2022
            config_preset: windows-vs2022
            build_preset: windows-vs2022-debug
            name: "Windows (VS 2022 Debug)"
          - os: windows-2022
            config_preset: windows-vs2022
            build_preset: windows-vs2022-release
            name: "Windows (VS 2022 Release)"

          - os: windows-2022
            config_preset: windows-ninja
            build_preset: windows-ninja-debug
            name: "Windows (Ninja Multi Debug)"
          - os: windows-2022
            config_preset: windows-ninja
            build_preset: windows-ninja-release
            name: "Windows (Ninja Multi Release)"

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5
      with:
        submodules: recursive

    # -------------------------------------------------------------------------
    # Windows-Only: vcpkg Environment & Binary Caching
    # -------------------------------------------------------------------------
    - name: Initialize vcpkg Environment (Windows)
      if: matrix.os == 'windows-2022'
      shell: pwsh
      run: |
        echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
        echo "VCPKG_DEFAULT_BINARY_CACHE=${{ github.workspace }}\.vcpkg_cache" >> $env:GITHUB_ENV
        New-Item -ItemType Directory -Force -Path "${{ github.workspace }}\.vcpkg_cache"

    - name: Cache vcpkg Binary Archives (Windows)
      if: matrix.os == 'windows-2022'
      uses: actions/cache@v5
      with:
        path: ${{ github.workspace }}\.vcpkg_cache
        key: vcpkg-windows-${{ matrix.build_preset }}-${{ hashFiles('**/vcpkg.json') }}
        restore-keys: |
          vcpkg-windows-${{ matrix.build_preset }}-
          vcpkg-windows-

    # -------------------------------------------------------------------------
    # Platform Dependency Injections
    # -------------------------------------------------------------------------
    - name: Ubuntu setup package manager & system dependencies
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo sh tools/ci/deps/deps.sh linux

    - name: macOS setup and dependencies
      if: matrix.os == 'macos-latest'
      run: |
        sh tools/ci/deps/deps.sh osx

    - name: Windows setup
      if: matrix.os == 'windows-2022'
      shell: pwsh
      run: |
        Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser
        Invoke-RestMethod -Uri https://get.scoop.sh | Invoke-Expression
        scoop install winflexbison
        echo "$env:USERPROFILE\scoop\shims" >> $env:GITHUB_PATH

    # -------------------------------------------------------------------------
    # Unified Build Execution (No forks required)
    # -------------------------------------------------------------------------
    - name: Run CMake Configure
      run: cmake --preset ${{ matrix.config_preset }}

    - name: Run CMake Build
      run: cmake --build --preset ${{ matrix.build_preset }}
