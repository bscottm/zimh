name: zimh cross-platform build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            config_preset: ninja-debug
            build_preset: ninja-debug
            test_preset: ninja-debug
            name: "Ubuntu (Ninja Debug)"
          - os: ubuntu-latest
            config_preset: ninja-release
            build_preset: ninja-release
            test_preset: ninja-release
            name: "Ubuntu (Ninja Release)"

          - os: macos-latest
            config_preset: macos-xcode
            build_preset: xcode-debug
            test_preset: xcode-debug
            name: "macOS (Xcode Debug)"
          - os: macos-latest
            config_preset: macos-xcode
            build_preset: xcode-release
            test_preset: xcode-release
            name: "macOS (Xcode Release)"

          - os: windows-2022
            config_preset: windows-vs2022
            build_preset: windows-vs2022-debug
            test_preset: windows-vs2022-debug
            name: "Windows (VS 2022 Debug)"
          - os: windows-2022
            config_preset: windows-vs2022
            build_preset: windows-vs2022-release
            test_preset: windows-vs2022-release
            name: "Windows (VS 2022 Release)"

          - os: windows-latest
            config_preset: windows-vs2026
            build_preset: windows-vs2026-debug
            test_preset: windows-vs2026-debug
            name: "Windows latest (VS2026 Debug)"
          - os: windows-latest
            config_preset: windows-vs2026
            build_preset: windows-vs2026-release
            test_preset: windows-vs2026-release
            name: "Windows latest (VS2026 Release)"

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7
      with:
        submodules: recursive

    # -------------------------------------------------------------------------
    # Windows-Only: vcpkg Environment & Binary Caching
    # -------------------------------------------------------------------------
    - name: Initialize vcpkg Environment (Windows)
      if: matrix.os == 'windows-2022' || matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
        echo "VCPKG_DEFAULT_BINARY_CACHE=${{ github.workspace }}\.vcpkg_cache" >> $env:GITHUB_ENV
        New-Item -ItemType Directory -Force -Path "${{ github.workspace }}\.vcpkg_cache"
        # Capture vcpkg commit for cache key
        Push-Location $env:VCPKG_INSTALLATION_ROOT
        $vcpkgCommit = git rev-parse --short=8 HEAD
        Pop-Location
        echo "VCPKG_COMMIT=$vcpkgCommit" >> $env:GITHUB_ENV

    - name: Cache vcpkg Binary Archives (Windows)
      if: matrix.os == 'windows-2022' || matrix.os == 'windows-latest'
      uses: actions/cache@v6
      with:
        path: ${{ github.workspace }}\.vcpkg_cache
        key: vcpkg-windows-${{ env.VCPKG_COMMIT }}-${{ matrix.build_preset }}-${{ hashFiles('**/vcpkg.json') }}
        restore-keys: |
          vcpkg-windows-${{ env.VCPKG_COMMIT }}-${{ matrix.build_preset }}-
          vcpkg-windows-${{ env.VCPKG_COMMIT }}-

    # -------------------------------------------------------------------------
    # Platform Dependency Injections
    # -------------------------------------------------------------------------
    - name: Ubuntu setup package manager & system dependencies
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo sh tools/ci/deps/deps.sh linux

    - name: macOS setup and dependencies
      if: matrix.os == 'macos-latest'
      run: |
        sh tools/ci/deps/deps.sh osx

    - name: Windows setup
      if: matrix.os == 'windows-2022' || matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser
        Invoke-RestMethod -Uri https://get.scoop.sh | Invoke-Expression
        scoop install winflexbison
        echo "$env:USERPROFILE\scoop\shims" >> $env:GITHUB_PATH

    # -------------------------------------------------------------------------
    # Unified Build Execution (No forks required)
    # -------------------------------------------------------------------------
    - name: Run CMake Configure
      run: cmake --preset ${{ matrix.config_preset }}

    - name: Run CMake Build
      run: cmake --build --preset ${{ matrix.build_preset }}

    - name: Run CMake Test
      run: ctest --preset ${{ matrix.test_preset }}

  netbsd:
    runs-on: ubuntu-latest
    name: NetBSD
    steps:
      - uses: actions/checkout@v7
      - name: NetBSD Release build
        id: netbsd-release
        uses: vmactions/netbsd-vm@v1
        with:
          prepare: |
            export PKG_PATH="https://cdn.NetBSD.org/pub/pkgsrc/packages/NetBSD/$(uname -p)/$(uname -r | cut -d_ -f1)/All"
            pkg_add pkgin
            pkgin -Fy install git
            echo "Installing X11 sets."
            cd /tmp
            ftp -o xbase.tar.xz https://cdn.netbsd.org/pub/NetBSD/NetBSD-$(uname -r | cut -d_ -f1)/amd64/binary/sets/xbase.tar.xz
            ftp -o xfont.tar.xz https://cdn.netbsd.org/pub/NetBSD/NetBSD-$(uname -r | cut -d_ -f1)/amd64/binary/sets/xfont.tar.xz
            ftp -o xserver.tar.xz https://cdn.netbsd.org/pub/NetBSD/NetBSD-$(uname -r | cut -d_ -f1)/amd64/binary/sets/xserver.tar.xz
            ftp -o xetc.tar.xz https://cdn.netbsd.org/pub/NetBSD/NetBSD-$(uname -r | cut -d_ -f1)/amd64/binary/sets/xetc.tar.xz
            # Extract into /
            cd /
            for f in /tmp/x*.tar.xz; do
                tar xJpf "$f"
            done 
            echo "Installing compile-time dependencies"
            cd "$GITHUB_WORKSPACE"
            sh tools/ci/deps/deps.sh netbsd-pkgin
          run: |
            cmake --preset ninja-release
            cmake --build --preset ninja-release
            ctest --preset ninja-release
