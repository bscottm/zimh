set console -n log=console.txt
set cpu 2k

carddeck -q join fds/load_card.dck fds/5440.2009_INTERPRETIVE_FDS.crd fds/example.txt AS deck_in.dck

att cdr1 -q deck_in.dck
set cdr1 wiring=fds

att cdp1 -n -q deck_out.dck
set cdp1 echo, print, wiring=8word
att cdp0 -n -q print.txt

d csw 70 1901 9999
d ar 8000
go
ex ar
show queue
exit
